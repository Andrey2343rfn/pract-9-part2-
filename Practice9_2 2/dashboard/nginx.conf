server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://cloud-connector:5000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
